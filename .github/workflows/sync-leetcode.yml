name: Sync LeetCode Solutions

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # runs every 6 hours (midnight, 6am, noon, 6pm UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout practice repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot manual problem notes
        run: node scripts/roadmap-sync.js snapshot --output "$RUNNER_TEMP/leetcode-manual-notes.json"

      - name: Sync LeetCode submissions
        uses: Buffden/leetcode-sync@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: ''
          verbose: true
          commit-header: '[LeetCode]'

      - name: Refresh checkout after sync
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Restore notes and enrich roadmap metadata
        run: node scripts/roadmap-sync.js enrich --snapshot "$RUNNER_TEMP/leetcode-manual-notes.json"

      - name: Commit roadmap-derived updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No roadmap metadata changes."
          else
            git commit -m "[Roadmap] refresh interview tracker metadata"
            git push origin HEAD:main
          fi
